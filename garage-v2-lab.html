<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DEBUG ONLY · Garage V2 Layout Lab（GARAGE-V2-INVENTORY-LAYOUT-LAB-R1）</title>
    <!--
      GARAGE-V2-INVENTORY-LAYOUT-LAB-R1｜Garage 2.0 布局/交互验证 Lab（可整块删除）。

      ⚠️ 与正式产品的关系：**零接入**。
        - 本页不进入 dist / dist-pages / dist-wechat 任一正式产物
          （构建登记见 vite.portrait-lab.config.ts）；
        - **存储完全隔离**：入口在 import 任何业务模块之前 bindPlatformCore(<内存 Map 后端>)，
          本页所有读/写（库存投影 / 合成事务 / Build）都落在内存里，真实 localStorage
          一个字节都不会被触碰（刷新即重置）；
        - 正式 home.html / 正式 Garage / 正式 Run 行为零改动。

      验证目标（用户拍板的 Garage 2.0 结构）：
        中上成品战车预览 / 左右五个穿戴槽 / 下方单件图标背包（品质边框 + 部位角标，
        不显示名字/数量/星级）/ 合成按钮在背包标题右上 / 底部仅返回。

      品质边界（不得冒充）：
        - 品质产物（qv2）尚未接入正式 Run 战斗 ⇒ 本页**不能**把它们写进正式装备，
          候选对比里明确标「未接入战斗」；
        - 旧 ★2..★5 锁定（legacy-star-locked）、Body 不可消耗（body-not-consumable）；
        - 「合成」在本页只做**预览**（选主件 → 自动 4 材料 → 展示产物外形）；
          由于存储是隔离 Map，这里可以真实调用 fuseQualityFive 且绝不影响真实存档。
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0e14;
        color: #e8edf5;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #g2-root {
        position: relative;
        width: 390px;
        height: 844px;
        margin: 0 auto;
        overflow: hidden;
        background: linear-gradient(180deg, #101726 0%, #0b0e14 100%);
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      @media (min-width: 700px) {
        #g2-root { margin: 16px auto; border: 1px solid #24304a; border-radius: 12px; }
      }

      /* ── 顶部：标题 ── */
      .g2-head {
        flex: 0 0 auto;
        display: flex; align-items: center; justify-content: center;
        height: 34px;
        font-size: 14px; font-weight: 700; color: #cfe0ff;
      }

      /* ── 中上：战车预览（正式 sprite 同源） ── */
      .g2-stage {
        flex: 0 0 auto;
        position: relative;
        height: 190px;
        overflow: hidden;
      }
      .g2-car {
        position: absolute; left: 0; top: 50%; transform: translateY(-58%);
        width: 100%; height: 170px;
      }
      .g2-car-item { position: absolute; }
      .g2-car-item img, img.g2-car-item { position: absolute; }
      .g2-car-fallback { background: rgba(120, 140, 170, 0.35); border-radius: 3px; }

      /* ── 中部：左右五槽 ── */
      .g2-slots-row {
        flex: 0 0 auto;
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: 4px 10px 6px;
      }
      .g2-slots-col { display: flex; flex-direction: column; gap: 8px; }
      .g2-slot {
        width: 64px; height: 64px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2px;
        border-radius: 10px;
        border: 1px solid #2b3550;
        background: #131b28;
        cursor: pointer;
        font: inherit;
        color: inherit;
        padding: 0;
      }
      .g2-slot .g2-part, .g2-slot .ph-part-icon { width: 40px; height: 30px; }
      .g2-slot-kind {
        font-size: 9px; color: #7f92ad; letter-spacing: 1px;
      }
      .g2-slot-empty { font-size: 10px; color: #55647d; }
      .g2-slot-eq { border-color: #4a7bd0; box-shadow: 0 0 0 1px rgba(74, 123, 208, 0.35); }

      /* ── 背包标题行（合成按钮在右上） ── */
      .g2-bag-head {
        flex: 0 0 auto;
        display: flex; align-items: center; justify-content: space-between;
        padding: 2px 12px 4px;
      }
      .g2-bag-title { font-size: 12px; color: #93a1b6; }
      .g2-fuse-btn {
        font: inherit; font-size: 12px; font-weight: 700;
        display: flex; align-items: center; gap: 4px;
        padding: 5px 12px; border-radius: 999px;
        border: 1px solid #2b3550;
        background: #131b28; color: #9fb3cc;
        cursor: pointer;
      }
      .g2-fuse-btn-ready {
        border-color: #7a5b00;
        background: linear-gradient(180deg, #ffd35a, #e8a92c); color: #3a2600;
      }
      .g2-fuse-dot {
        min-width: 16px; height: 16px; padding: 0 4px;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 999px; background: #e2445c; color: #fff;
        font-size: 10px; font-weight: 800;
      }

      /* ── 背包网格（唯一滚动容器；3-5 列自适应） ── */
      .g2-bag {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 0 12px 8px;
      }
      .g2-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      @media (max-width: 374px) { .g2-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (min-width: 430px) { .g2-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
      .g2-cell {
        position: relative;
        aspect-ratio: 1 / 1;
        display: flex; align-items: center; justify-content: center;
        border-radius: 10px;
        border: 2px solid var(--q, #5a6b85);
        background: rgba(19, 27, 40, 0.9);
        cursor: pointer;
        font: inherit; padding: 0;
      }
      .g2-cell .g2-part, .g2-cell .ph-part-icon { width: 62%; height: 62%; object-fit: contain; }
      .g2-cell .g2-corner {
        position: absolute; left: 3px; top: 3px;
        font-size: 8px; line-height: 1;
        padding: 2px 3px; border-radius: 4px;
        background: rgba(7, 10, 16, 0.75);
        color: #aebdd2;
      }
      .g2-cell-locked { opacity: 0.42; }
      .g2-cell-locked::after {
        content: '🔒';
        position: absolute; right: 3px; top: 3px; font-size: 9px;
      }
      /* 品质七档边框色（白绿蓝紫橙红彩） */
      .g2-cell[data-q='white']  { --q: #9aa7b8; }
      .g2-cell[data-q='green']  { --q: #4caf6d; }
      .g2-cell[data-q='blue']   { --q: #3f8fd2; }
      .g2-cell[data-q='purple'] { --q: #9b6bd8; }
      .g2-cell[data-q='orange'] { --q: #e08b3a; }
      .g2-cell[data-q='red']    { --q: #e2445c; }
      .g2-cell[data-q='chrome'] {
        --q: #ffd35a;
        background: linear-gradient(135deg, rgba(255, 211, 90, 0.16), rgba(226, 68, 92, 0.16), rgba(63, 143, 210, 0.16));
      }

      /* ── 底部：仅返回 ── */
      .g2-foot {
        flex: 0 0 auto;
        display: flex; justify-content: center;
        padding: 8px 14px 14px;
      }
      .g2-back {
        font: inherit; font-size: 14px; font-weight: 700;
        width: 100%; max-width: 240px;
        padding: 11px 0; border-radius: 12px;
        border: 1px solid #2b3550; background: #1a2536; color: #cfe0ff;
        cursor: pointer;
      }

      /* ── 弹窗（对比 / 合成预览共用壳） ── */
      .g2-mask {
        position: absolute; inset: 0; z-index: 10;
        background: rgba(5, 8, 13, 0.72);
        display: flex; align-items: center; justify-content: center;
        padding: 18px;
      }
      .g2-modal {
        width: 100%; max-width: 330px;
        border-radius: 14px;
        border: 1px solid #2b3550;
        background: #101823;
        padding: 14px;
        display: flex; flex-direction: column; gap: 10px;
      }
      .g2-modal-title { font-size: 14px; font-weight: 700; color: #eaf1fb; }
      .g2-compare { display: flex; align-items: stretch; gap: 8px; }
      .g2-col {
        flex: 1 1 0;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        padding: 10px 6px;
        border-radius: 10px;
        border: 1px solid #2b3550; background: #131b28;
      }
      .g2-col-new { border-color: var(--q, #4a7bd0); }
      .g2-col-tag { font-size: 10px; color: #7f92ad; letter-spacing: 2px; }
      .g2-col .g2-part, .g2-col .ph-part-icon { width: 64px; height: 48px; object-fit: contain; }
      .g2-col-q { font-size: 11px; font-weight: 700; }
      .g2-col[data-q='white']  { --q: #9aa7b8; } .g2-col[data-q='white']  .g2-col-q { color: #9aa7b8; }
      .g2-col[data-q='green']  { --q: #4caf6d; } .g2-col[data-q='green']  .g2-col-q { color: #4caf6d; }
      .g2-col[data-q='blue']   { --q: #3f8fd2; } .g2-col[data-q='blue']   .g2-col-q { color: #3f8fd2; }
      .g2-col[data-q='purple'] { --q: #9b6bd8; } .g2-col[data-q='purple'] .g2-col-q { color: #9b6bd8; }
      .g2-col[data-q='orange'] { --q: #e08b3a; } .g2-col[data-q='orange'] .g2-col-q { color: #e08b3a; }
      .g2-col[data-q='red']    { --q: #e2445c; } .g2-col[data-q='red']    .g2-col-q { color: #e2445c; }
      .g2-col[data-q='chrome'] { --q: #ffd35a; } .g2-col[data-q='chrome'] .g2-col-q { color: #ffd35a; }
      .g2-col-note { font-size: 10px; color: #93a1b6; text-align: center; min-height: 12px; }
      .g2-warn {
        font-size: 11px; line-height: 1.5; color: #e8b45a;
        background: rgba(232, 180, 90, 0.08);
        border: 1px solid rgba(232, 180, 90, 0.3);
        border-radius: 8px; padding: 6px 8px;
      }
      .g2-mats { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
      .g2-mat {
        width: 44px; height: 44px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 8px;
        border: 2px solid var(--q, #5a6b85);
        background: rgba(19, 27, 40, 0.9);
      }
      .g2-mat .g2-part, .g2-mat .ph-part-icon { width: 60%; height: 60%; object-fit: contain; }
      .g2-actions { display: flex; gap: 8px; }
      .g2-btn {
        flex: 1 1 0;
        font: inherit; font-size: 13px; font-weight: 700;
        padding: 10px 0; border-radius: 10px;
        border: 1px solid #2b3550; background: #1a2536; color: #cfe0ff;
        cursor: pointer;
      }
      .g2-btn-primary {
        border-color: #4a7bd0; background: #274b7a; color: #fff;
      }
      .g2-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div id="g2-root"></div>
    <script type="module" src="/src/product/garageV2LabMain.ts"></script>
  </body>
</html>
