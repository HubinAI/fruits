<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DEBUG ONLY · Portrait Battle Lab（非玩家体验入口）</title>
    <!--
      PBL-F0-PORTRAIT-BATTLE-LAB-FOUNDATION｜竖屏战场实验台独立入口 = **Debug control area**。

      PRP-R1-ACTUAL-RUNTIME-ENTRY-LAYOUT-FIX：
      本页面是开发/调试面（Arena A/B、Loadout、Encounter、Start、Reset、Gate），
      **不是玩家体验入口**，默认不作为体验链接给出。玩家体验入口只有一个：
        run-page.html（= npm run dev:run-page）
      对应 npm script 已改名为 dev:debug-lab，避免再被误当作体验入口打开。

      与正式入口 index.html 完全隔离：本页面不参与 npm run build / build:pages / build:e2e /
      build:wechat 任一正式构建；实验失败可直接删除本文件与 src/lab/portraitBattleLab/。
      样式仅为「可操作的最小集合」，不做 UI 美化。
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #0d1016;
        color: #e8e8f0;
        -webkit-font-smoothing: antialiased;
      }
      #pbl-root.pbl-root { display: flex; flex-direction: column; height: 100vh; }
      .pbl-bar {
        display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
        padding: 8px 12px; background: #171c26; border-bottom: 1px solid #2a3140;
      }
      .pbl-group { display: flex; gap: 6px; align-items: center; }
      .pbl-group-label { font-size: 12px; color: #8a93a5; margin-right: 2px; }
      .pbl-btn {
        background: #242b38; color: #e8e8f0; border: 1px solid #38414f; border-radius: 6px;
        padding: 6px 12px; cursor: pointer; font-size: 13px;
      }
      .pbl-btn:hover { background: #2e3747; }
      .pbl-btn-active { border-color: #4a7fe0; background: #2a3a5c; box-shadow: 0 0 0 1px #3b6fd4 inset; color: #fff; }
      .pbl-btn-primary { background: #3b6fd4; border-color: #5a8df0; font-weight: 700; letter-spacing: 2px; }
      .pbl-btn-primary:hover { background: #4a7fe0; }
      .pbl-btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .pbl-status { padding: 6px 12px; font: 12px/1.5 monospace; color: #9aa4b5; background: #12161f; border-bottom: 1px solid #2a3140; }
      /* PBL-G1 门禁面板：纯 DOM 文本，位于 canvas 之外 → 对像素分类零影响 */
      .pbl-gate {
        padding: 6px 12px; font: 11px/1.45 monospace; color: #b9c2d2;
        background: #0f141c; border-bottom: 1px solid #2a3140;
        white-space: pre; overflow: auto; max-height: 32vh; flex-shrink: 0;
      }
      .pbl-gate[data-verdict='blocked'] { color: #ffd35a; }
      .pbl-gate[data-verdict='fail'] { color: #ff6b5e; }
      .pbl-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
      .pbl-stage canvas { position: absolute; }
      /*
        PRP-R1 必改 1：Debug 页面必须自我标识，防止再被当作体验入口截图。
        position:fixed + pointer-events:none → 完全脱离文档流：
        不改变 canvas 几何，也不进入 canvas 的 getImageData 像素统计。
      */
      .pbl-debug-badge {
        position: fixed; right: 10px; bottom: 10px; z-index: 9999;
        pointer-events: none;
        padding: 6px 12px; border-radius: 999px;
        font: 700 12px/1.4 monospace; letter-spacing: 0.4px;
        color: #ffd35a; background: rgba(22, 13, 0, 0.94);
        border: 1px solid #7a5b00;
      }
      /*
        PBL-M3-LIGHT-SWARM-EXPERIENCE-VALIDATION-R1：体验验证条幅。
        纯 DOM、位于 canvas 之外 ⇒ 完全不进入像素分类统计（与 .pbl-status / .pbl-gate 同约定）。
        未进入 = 中性底；已进入 = 加深底色，两态都常驻显示 EXPERIENCE VALIDATION ONLY。
      */
      .pbl-validation-banner {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline;
        padding: 7px 12px; background: #1a1408; border-bottom: 1px solid #7a5b00;
        font-size: 12px; line-height: 1.5;
      }
      .pbl-validation-banner[data-active='true'] { background: #241a00; }
      .pbl-vb-title { font: 700 13px/1.4 monospace; letter-spacing: 0.6px; color: #ffd35a; }
      .pbl-vb-sub { font: 700 12px/1.4 monospace; color: #ff9b3d; }
      .pbl-vb-state { color: #b9c2d2; }
      .pbl-vb-question { flex-basis: 100%; color: #e8e8f0; }
      .pbl-vb-note { flex-basis: 100%; color: #8a93a5; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="pbl-root"></div>
    <div class="pbl-debug-badge" role="note">
      DEBUG ONLY · 非玩家体验入口 · 玩家版本请打开 /run-page.html
    </div>
    <script type="module" src="/src/lab/portraitBattleLab/main.ts"></script>
  </body>
</html>
