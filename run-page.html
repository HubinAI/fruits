<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>最强水果 — Portrait Run Prototype（PRP-F0 Run Page）</title>
    <!--
      PRP-F0-RUN-PAGE-SHELL｜Portrait Run Prototype 玩家入口。

      产品基线：整个单局是**一个持续存在的竖屏 Adventure Run Page**；
      战斗 / 事件 / 强化 / 结果都是同一页面的不同状态，不存在页面跳转。
      画布内的五个状态由 src/lab/portraitBattleLab/runPage.ts 全量绘制。

      隔离：本页面不参与 npm run build / build:pages / build:e2e / build:wechat
      任一正式构建；实验失败可直接删除本文件与 src/lab/portraitBattleLab/。

      Debug 与玩家界面分离：本页**不含**任何开发控制（Arena / Loadout / Encounter /
      Start / Reset / Gate）。开发控制在独立入口 portrait-lab.html。
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #06090e;
        color: #e9eef7;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      /* 唯一容器 = 整个视口；画布由 PlayerViewportTransform contain 缩放居中 */
      #run-root.run-root { position: fixed; inset: 0; }

      /*
        手机画面容器（PRP-R1 必改 4：电脑预览要能直接做真人验收）。

        - 桌面（宽 > 640px）：390×844 画面**居中放大**为一个「手机页面」，
          高度约 88vh（上限 940px），严格保持 390:844，页面外只留中性背景；
        - 窄屏（真机 / 窄窗口）：铺满视口，contain 缩放（与 F0 行为一致）。

        容器尺寸只影响 PlayerViewportTransform 的 contain 缩放，
        逻辑舞台恒为 390×844 —— 不引入第二套坐标，也不影响任何命中区。
      */
      .run-stage {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        height: min(88vh, 940px);
        width: calc(min(88vh, 940px) * 390 / 844);
        overflow: hidden;
        background: #0b0e14;
        border-radius: 10px;
        box-shadow: 0 0 0 1px #1b2434, 0 24px 70px rgba(0, 0, 0, 0.6);
      }
      .run-stage canvas { touch-action: manipulation; }

      @media (max-width: 640px), (max-height: 620px) {
        .run-stage {
          left: 0;
          top: 0;
          transform: none;
          width: 100%;
          height: 100%;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="run-root"></div>
    <script type="module" src="/src/lab/portraitBattleLab/runMain.ts"></script>
  </body>
</html>
