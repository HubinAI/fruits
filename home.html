<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>最强水果 — 我的战车（首页 / 调整战车）</title>
    <!--
      PRODUCT-LOOP-R1-A-HOME-GARAGE-INVENTORY｜竖屏正式产品主循环第一段：**局外配车**。

        `首页（看车 + 已装备） --[调整战车]→ 调整战车（选一件已拥有武器 → 装备） --[返回首页]→ 首页同步`

      ✅ 本注释内**禁止出现 HTML 注释终止序列**（两个连字符紧跟一个右尖括号）。
         本行原先把它写进了箭头图里 ⇒ 浏览器在第 10 行就**提前闭合注释**，其后文本全部
         按真标签解析：第 26 行那份用反引号包着的 anchor 示例被解析成**真锚点**（空 href
         ⇒ 解析为当前 URL）⇒ 真实鼠标点击**任何位置**都会触发整页重载，Garage 视图
         永远打不开（PRODUCT-LOOP-R1-C 定位并修复；`tests/productLoopHomeGarage.test.ts`
         的 `PL-33` 机器守卫防止回归）。

      「首页」与「调整战车」是**同一页面的两个视图**（整页零跳转），与本分支既有玩家页面
      「单页多状态」的产品结构一致；页面代码在 src/product/（**不在** debug lab 目录内）。

      复用（不新建）：
        - 当前 Build = 正式 core/buildPersistence.ts 的 strongfruit.playerBuild.v1
          （与 game/playerGameRuntime.ts 读的是同一处 ⇒ 唯一数据源）；
        - 库存 = 正式 core/partInventory.ts 的 ensureInventory（幂等，不重复生成）；
        - 武器定义 = 正式 core/content.ts 的 registry.functionals（category === 'weapon'）；
        - 车辆外形 = 正式 assets/visuals/*.png + 正式 BodyDef / FunctionalPartDef 的 visual 定义。

      边界（Queue 冻结项）：
        - 本页**不参与** npm run build / build:pages / build:e2e / build:wechat 任一正式构建；
        - 不新建 Runtime、不改 Run / Battle Camera / Battle Physics / Buff / Encounter /
          Validation Hub / Encounter Lab / Content Batch / Economy；
        - PRODUCT-LOOP-R2-B｜「调整战车」多一个**合成**动作（点一次 = 一次 5 合 1，
          规则在 src/product/playerGrowth.ts）；本页仍然：不碰任何存储 API、不做拖拽合成、
          不做连锁/批量合成、不改任何战斗数值（星级带来的能量/伤害倍率是 core Q22 既有语义）。
          ⚠️ 写本注释时注意：存储 API 的**名字**本身也是被守卫扫描的字符串（直接扫原文，不剥注释）。

        `开始冒险` 只是同产物内的相对链接（`<a href>`，本页不写 location）。

      PRODUCT-LOOP-R1-C｜**本页是默认玩家入口**（`npm run dev` 的根路径由 build/branchDevEntry.ts
        在 dev 下重写到本页；所有研发 Validation 页面仍保留各自的显式地址）。

        `开始冒险` 的链接**带两样东西**：
          - `run=<本局 token>`：领奖幂等键（PRODUCT-LOOP-R1-B）；
          - `equipped=<本份 Build 存档的 JSON>`：本页当前装备的**完整 BuildDraft**。
        两者都在 `src/product/runReward.ts` 生成（**地址由产品侧独占**，Run 侧只解析）。
        Run 侧据此把「玩家车怎么装」这件事交给正式编排器 —— 于是「首页显示的主武器」
        与「下一局战斗里实际用的武器」是同一份数据，不存在第二套 loadout 语义。
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #06090e;
        color: #e9eef7;
        -webkit-font-smoothing: antialiased;
      }

      /* 唯一容器 = 整视口；手机框按 390×844 contain 缩放居中（与 Run Page 同口径） */
      #ph-root.ph-root { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

      .ph-frame {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 0 0 1px #1b2434, 0 24px 70px rgba(0, 0, 0, 0.62);
      }
      /* 逻辑舞台恒 390×844；只缩放，不改布局口径 */
      .ph-screen {
        width: 390px;
        height: 844px;
        transform-origin: top left;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #0a0f18 0%, #0e1626 42%, #16243c 100%);
        overflow: hidden;
      }

      /* ------------------------------------------------------------------ 顶栏 */
      .ph-header {
        flex: 0 0 auto;
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 18px 16px 10px;
        border-bottom: 1px solid rgba(63, 93, 130, 0.35);
      }
      .ph-title { font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
      .ph-sub { font-size: 12px; color: #93a1b6; }

      /* ------------------------------------------------------------------ 主体 */
      .ph-main {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 14px 18px;
      }

      /* 战车展示（DOM 合成；零画布） */
      .ph-car-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 6px 0 2px;
        border-radius: 12px;
        border: 1px solid rgba(34, 48, 74, 0.9);
        background: radial-gradient(120% 90% at 50% 92%, rgba(63, 93, 130, 0.28), rgba(12, 17, 25, 0.9));
      }
      .ph-car-wrap-sm { padding: 2px 0 0; }
      .ph-car { position: relative; width: 100%; }
      .ph-car-item { position: absolute; display: block; object-fit: fill; }
      .ph-car-fallback {
        background: #8b96a8;
        border: 1px solid #4c566a;
        opacity: 0.9;
      }
      .ph-car-weapon { outline: 2px solid #ffd35a; outline-offset: 1px; border-radius: 3px; }

      .ph-spec { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; padding: 0 4px 6px; }
      .ph-body { font-size: 15px; font-weight: 650; color: #eaf1fb; }
      .ph-stat {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px; color: #9fb0c8;
      }

      /* 装备摘要 */
      .ph-sec { font-size: 13px; color: #93a1b6; letter-spacing: 0.04em; }
      .ph-slots { list-style: none; display: flex; flex-direction: column; gap: 6px; }
      .ph-slot {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 12px;
        border-radius: 9px;
        border: 1px solid #22304a;
        background: #101823;
        font-size: 13px;
      }
      .ph-slot-weapon { border-color: #7a5b00; background: #1a1607; }
      .ph-slot-label { flex: 0 0 76px; color: #8a93a5; font-size: 12px; }
      .ph-slot-name { flex: 1 1 auto; color: #e3ebf7; }
      .ph-slot-tag {
        flex: 0 0 auto;
        font-size: 11px; padding: 2px 7px; border-radius: 999px;
        color: #ffd35a; border: 1px solid #7a5b00; background: rgba(122, 91, 0, 0.25);
      }

      /* 当前 Weapon（调整战车） */
      .ph-current {
        display: flex; align-items: baseline; gap: 10px;
        padding: 11px 13px;
        border-radius: 10px;
        border: 1px solid #7a5b00;
        background: #1a1607;
      }
      .ph-current-label { font-size: 12px; color: #b99a3f; }
      .ph-current-name { font-size: 17px; font-weight: 700; color: #ffe9a8; }

      /* 库存武器 */
      .ph-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .ph-card {
        display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
        padding: 11px 12px; text-align: left; font: inherit;
        border-radius: 10px; border: 1px solid #2b3550; background: #131b28; color: inherit;
        cursor: pointer;
      }
      .ph-card:hover { background: #1a2536; border-color: #34507c; }
      .ph-card-selected { border-color: #ffd35a; box-shadow: inset 3px 0 0 #ffd35a; background: #1c2233; }
      .ph-card-equipped { border-color: #3f8f5a; }
      .ph-card-name { font-size: 15px; font-weight: 650; color: #eaf1fb; }
      /*
        PRODUCT-LOOP-R2-C｜最终主属性那一行（`攻击 80 → 100`）。
        刻意只有这一行，不加属性面板（Queue 必改 4 明令）。
      */
      .ph-card-damage { font-size: 12px; font-weight: 600; color: #ffd7a0; letter-spacing: 0.02em; }
      .ph-card-meta { font-size: 11px; color: #93a1b6; }
      .ph-card-tag { font-size: 10px; color: #8fe0ad; }

      /*
        PRODUCT-LOOP-R2-B｜合成（最小动作）。

        ⚠️ 卡片本身是 <button>，而「合成」也是一个按钮 —— HTML 不允许 button 套 button，
           所以合成按钮是卡片的**兄弟节点**，两者同放在 `.ph-card-cell` 里；合成按钮用绝对
           定位压在卡片右上角，视觉上仍在卡内，但 DOM 上是平级 ⇒ 合法且点击不会互相吞掉。
      */
      .ph-card-cell { position: relative; display: flex; }
      .ph-card-cell > .ph-card { flex: 1 1 auto; width: 100%; }
      .ph-card-full { border-color: #7a5b00; background: #191604; }
      .ph-card-badge { font-size: 10px; font-weight: 700; color: #ffd35a; }
      .ph-card-badge-max { color: #93a1b6; }
      .ph-card-fuse {
        position: absolute; top: 6px; right: 6px;
        font: inherit; font-size: 11px; font-weight: 700;
        padding: 4px 9px; border-radius: 999px;
        border: 1px solid #7a5b00;
        background: linear-gradient(180deg, #ffd35a, #e8a92c); color: #3a2600;
        cursor: pointer;
      }
      .ph-card-fuse:hover { background: linear-gradient(180deg, #ffe07e, #f0b53c); }

      /* 动作 */
      .ph-actions { display: flex; gap: 10px; margin-top: auto; padding-top: 12px; }
      .ph-btn {
        flex: 1 1 0;
        display: flex; align-items: center; justify-content: center;
        min-height: 46px; padding: 0 14px;
        font: inherit; font-size: 16px; font-weight: 700;
        border-radius: 11px; border: 1px solid #2b3550; background: #141c28; color: #cfe0ff;
        cursor: pointer; text-decoration: none;
      }
      .ph-btn:hover { background: #1c2740; }
      .ph-btn:disabled { opacity: 0.45; cursor: default; }
      .ph-btn-primary { border-color: #3d6494; background: #1d3352; color: #dbe9ff; }
      .ph-btn-primary:hover { background: #274267; }
      .ph-btn-start {
        border-color: #7a5b00; background: linear-gradient(180deg, #ffd35a, #e8a92c); color: #3a2600;
      }
      .ph-btn-start:hover { background: linear-gradient(180deg, #ffe07e, #f0b53c); }

      .ph-note { font-size: 11px; color: #7b8697; line-height: 1.6; }
      .ph-note-ok { color: #8fe0ad; }
      .ph-note-bad { color: #ff9c8f; }

      /*
        PRODUCT-LOOP-R1-B｜领奖提示（玩家从 RUN COMPLETE 的「领取并返回」回到本页时出现）。
        三种形态与 Profile Repository 的真实结果一一对应：
          ok（已获得·入库成功）/ duplicate（本局已领取过）/ fail（校验未通过）。
      */
      .ph-claim {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.5;
        border: 1px solid #2b3850;
        background: #121a26;
        color: #c7d0df;
      }
      .ph-claim-ok { border-color: #3f6b52; background: #12211a; color: #8fe0ad; }
      .ph-claim-dim { color: #93a1b6; }
      .ph-claim-bad { border-color: #6b3f3f; background: #211414; color: #ff9c8f; }
    </style>
  </head>
  <body>
    <div id="ph-root" class="ph-root"></div>
    <script type="module" src="/src/product/homeMain.ts"></script>
  </body>
</html>
