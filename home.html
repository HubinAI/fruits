<html lang="zh-CN">

    <meta charset="UTF-8" />

    <title>最强水果 — 我的战车（首页 / 调整战车）</title>
    <!--
      PRODUCT-LOOP-R1-A-HOME-GARAGE-INVENTORY｜竖屏正式产品主循环第一段：**局外配车**。

        `首页（看车 + 已装备） --[调整战车]→ 调整战车（选一件已拥有武器 → 装备） --[返回首页]→ 首页同步`

      ✅ 本注释内**禁止出现 HTML 注释终止序列**（两个连字符紧跟一个右尖括号）。
         本行原先把它写进了箭头图里 ⇒ 浏览器在第 10 行就**提前闭合注释**，其后文本全部
         按真标签解析：第 26 行那份用反引号包着的 anchor 示例被解析成**真锚点**（空 href
         ⇒ 解析为当前 URL）⇒ 真实鼠标点击**任何位置**都会触发整页重载，Garage 视图
         永远打不开（PRODUCT-LOOP-R1-C 定位并修复；`tests/productLoopHomeGarage.test.ts`
         的 `PL-33` 机器守卫防止回归）。

      「首页」与「调整战车」是**同一页面的两个视图**（整页零跳转），与本分支既有玩家页面
      「单页多状态」的产品结构一致；页面代码在 src/product/（**不在** debug lab 目录内）。

      复用（不新建）：
        - 当前 Build = 正式 core/buildPersistence.ts 的 strongfruit.playerBuild.v1
          （与 game/playerGameRuntime.ts 读的是同一处 ⇒ 唯一数据源）；
        - 库存 = 正式 core/partInventory.ts 的 ensureInventory（幂等，不重复生成）；
        - 武器定义 = 正式 core/content.ts 的 registry.functionals（category === 'weapon'）；
        - 车辆外形 = 正式 assets/visuals/*.png + 正式 BodyDef / FunctionalPartDef 的 visual 定义。

      边界（Queue 冻结项）：
        - 本页**不参与** npm run build / build:pages / build:e2e / build:wechat 任一正式构建；
        - 不新建 Runtime、不改 Run / Battle Camera / Battle Physics / Buff / Encounter /
          Validation Hub / Encounter Lab / Content Batch / Economy；
        - PRODUCT-LOOP-R2-B｜「调整战车」多一个**合成**动作（点一次 = 一次 5 合 1，
          规则在 src/product/playerGrowth.ts）；本页仍然：不碰任何存储 API、不做拖拽合成、
          不做连锁/批量合成、不改任何战斗数值（星级带来的能量/伤害倍率是 core Q22 既有语义）。
          ⚠️ 写本注释时注意：存储 API 的**名字**本身也是被守卫扫描的字符串（直接扫原文，不剥注释）。

        `开始冒险` 只是同产物内的相对链接（`<a href>`，本页不写 location）。

      PRODUCT-LOOP-R1-C｜**本页是默认玩家入口**（`npm run dev` 的根路径由 build/branchDevEntry.ts
        在 dev 下重写到本页；所有研发 Validation 页面仍保留各自的显式地址）。

        `开始冒险` 的链接**带两样东西**：
          - `run=<本局 token>`：领奖幂等键（PRODUCT-LOOP-R1-B）；
          - `equipped=<本份 Build 存档的 JSON>`：本页当前装备的**完整 BuildDraft**。
        两者都在 `src/product/runReward.ts` 生成（**地址由产品侧独占**，Run 侧只解析）。
        Run 侧据此把「玩家车怎么装」这件事交给正式编排器 —— 于是「首页显示的主武器」
        与「下一局战斗里实际用的武器」是同一份数据，不存在第二套 loadout 语义。
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #06090e;
        color: #e9eef7;
        -webkit-font-smoothing: antialiased;
      }

      /* 唯一容器 = 整视口；手机框按 390×844 contain 缩放居中（与 Run Page 同口径） */
      #ph-root.ph-root { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

      .ph-frame {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 0 0 1px #1b2434, 0 24px 70px rgba(0, 0, 0, 0.62);
      }
      /* 逻辑舞台恒 390×844；只缩放，不改布局口径 */
      .ph-screen {
        width: 390px;
        height: 844px;
        transform-origin: top left;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #0a0f18 0%, #0e1626 42%, #16243c 100%);
        overflow: hidden;
      }

      /* ------------------------------------------------------------------ 顶栏 */
      .ph-header {
        flex: 0 0 auto;
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 18px 16px 10px;
        border-bottom: 1px solid rgba(63, 93, 130, 0.35);
      }
      .ph-title { font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
      .ph-sub { font-size: 12px; color: #93a1b6; }

      /* ------------------------------------------------------------------ 主体 */
      .ph-main {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 14px 18px;
      }

      /* 战车展示（DOM 合成；零画布） */
      .ph-car-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 6px 0 2px;
        border-radius: 12px;
        border: 1px solid rgba(34, 48, 74, 0.9);
        background: radial-gradient(120% 90% at 50% 92%, rgba(63, 93, 130, 0.28), rgba(12, 17, 25, 0.9));
      }
      .ph-car-wrap-sm { padding: 2px 0 0; }
      .ph-car { position: relative; width: 100%; }
      .ph-car-item { position: absolute; display: block; object-fit: fill; }
      .ph-car-fallback {
        background: #8b96a8;
        border: 1px solid #4c566a;
        opacity: 0.9;
      }
      .ph-car-weapon { outline: 2px solid #ffd35a; outline-offset: 1px; border-radius: 3px; }

      .ph-spec { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; padding: 0 4px 6px; }
      .ph-body { font-size: 15px; font-weight: 650; color: #eaf1fb; }
      .ph-stat {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px; color: #9fb0c8;
      }

      /* 装备摘要 */
      .ph-sec { font-size: 13px; color: #93a1b6; letter-spacing: 0.04em; }
      .ph-slots { list-style: none; display: flex; flex-direction: column; gap: 6px; }
      .ph-slot {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 12px;
        border-radius: 9px;
        border: 1px solid #22304a;
        background: #101823;
        font-size: 13px;
      }
      .ph-slot-weapon { border-color: #7a5b00; background: #1a1607; }
      .ph-slot-label { flex: 0 0 76px; color: #8a93a5; font-size: 12px; }
      .ph-slot-name { flex: 1 1 auto; color: #e3ebf7; }
      .ph-slot-tag {
        flex: 0 0 auto;
        font-size: 11px; padding: 2px 7px; border-radius: 999px;
        color: #ffd35a; border: 1px solid #7a5b00; background: rgba(122, 91, 0, 0.25);
      }

      /* 当前 Weapon（调整战车） */
      .ph-current {
        display: flex; align-items: baseline; gap: 10px;
        padding: 11px 13px;
        border-radius: 10px;
        border: 1px solid #7a5b00;
        background: #1a1607;
      }
      .ph-current-label { font-size: 12px; color: #b99a3f; }
      .ph-current-name { font-size: 17px; font-weight: 700; color: #ffe9a8; }

      /* 库存武器 */
      .ph-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .ph-card {
        display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
        padding: 11px 12px; text-align: left; font: inherit;
        border-radius: 10px; border: 1px solid #2b3550; background: #131b28; color: inherit;
        cursor: pointer;
      }
      .ph-card:hover { background: #1a2536; border-color: #34507c; }
      .ph-card-selected { border-color: #ffd35a; box-shadow: inset 3px 0 0 #ffd35a; background: #1c2233; }
      .ph-card-equipped { border-color: #3f8f5a; }
      .ph-card-name { font-size: 15px; font-weight: 650; color: #eaf1fb; }
      /*
        PRODUCT-LOOP-R2-C｜最终主属性那一行（`攻击 120 → 150`）。
        刻意只有这一行，不加属性面板（Queue 必改 4 明令）。
        ⚠️ 具体的伤害数字**只来自** `weaponEntries().damageText`（页面不写死、不自算）。
      */
      .ph-card-damage { font-size: 12px; font-weight: 600; color: #ffd7a0; letter-spacing: 0.02em; }
      /*
        PRODUCT-LOOP-R2-RECOVERY（必改 4）｜**成长 = 卡片主体信息**（不是卡片 meta 的行尾）。

        真人反馈 ④：底部说明里有合成写法，但真人完全找不到 `4/5` / `5/5` 的真实成长过程。
        ⇒ 这两行被提升成独立、醒目、与名称同视觉层级的主体信息：
          `成长 4/5`（进行中）/ `还差 1 个即可升星`（离满差 1 时的下一步）。
      */
      .ph-card-growth { font-size: 13px; font-weight: 700; color: #cfe0ff; letter-spacing: 0.02em; }
      .ph-card-hint { font-size: 11px; font-weight: 600; color: #8fe0ad; }
      .ph-card-meta { font-size: 11px; color: #93a1b6; }
      .ph-card-tag { font-size: 10px; color: #8fe0ad; }
      /*
        PRODUCT-LOOP-R3-MOVEMENT-GARAGE-EQUIP｜Garage 的 **Movement（轮组）配置区**。

        ⚠️ 与武器区**同一套视觉语言**（同一个 `.ph-grid` / `.ph-card` / `.ph-card-cell`
           / `.ph-actions`）：这里只补「按挂点分行」需要的三个容器类，不引入第二套卡片。
        ⚠️ 为什么必须有样式：区里的结构类（`ph-mv-row` 等）若不定义，会退化成无间距的
           裸块 —— 功能虽在，但玩家看不出「这是 rear 那一行、那是 front 那一行」。
           这不是新设计，只是把既有卡片摆成两行。
      */
      .ph-mv-row { display: flex; flex-direction: column; gap: 6px; }
      .ph-mv-row + .ph-mv-row { margin-top: 10px; }
      .ph-mv-label {
        font-size: 12px; font-weight: 700; color: #9fb3cc; letter-spacing: 0.04em;
      }
      .ph-mv-current { font-size: 11px; color: #93a1b6; margin-left: 8px; font-weight: 500; }
      /* 轮组卡比武器卡矮一点：一行要放「缺省轮 / 三档 / 未装载」共 5 项 */
      .ph-card-mv { padding: 8px 9px; gap: 2px; }
      .ph-card-mv .ph-card-name { font-size: 13px; }
      /*
        PRODUCT-LOOP-R3-MOVEMENT-CARD-READABILITY｜轮组卡的**刻度量行**（`轮径 12 · 质量 6 · 能耗 5`）。

        ⚠️ 与武器卡的 `.ph-card-damage`（主属性那一行）同一个视觉层级、同一种灰调：
           它是**读数**（玩家用来比较），不是标签也不是提示语 —— 所以不做成 tag 的绿色、
           也不做成 badge 的强调色（那会让它看起来像状态而不是数值）。
        ⚠️ 只在 `.ph-card-mv` 内生效：武器卡不该出现这一行。
      */
      .ph-card-mv .ph-card-stats { font-size: 11px; color: #b8c6da; letter-spacing: 0.01em; }
      .ph-mv-actions { margin-top: 8px; }
      /*
        PRODUCT-LOOP-R2-RECOVERY（必改 5）｜首页的一行最小成长状态。
        ⚠️ 只是一行**读数**，没有按钮、没有新入口：点「调整战车」去 Garage 合成。
      */
      .ph-home-growth {
        display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px;
        margin: 8px 0 0; padding: 8px 12px; border-radius: 10px;
        border: 1px solid #2b3550; background: #141c28;
      }
      .ph-home-growth-name { font-size: 12px; color: #93a1b6; }
      .ph-home-growth-value { font-size: 14px; font-weight: 700; color: #eaf1fb; }
      .ph-home-growth-ready { font-size: 12px; font-weight: 700; color: #ffd35a; }
      .ph-home-growth[data-ph-home-growth-ready='true'] { border-color: #7a5b00; background: #191604; }

      /*
        PRODUCT-LOOP-P0｜不支持完整 Run 时的最小提示，以及不可执行的「开始冒险」。

        ⚠️ 不可执行形态是**没有 href 的 disabled 按钮**（不是「链接在但点了没用」）
           ⇒ 这里只负责视觉上说得清楚，拦不拦得住由 DOM 结构保证。
      */
      .ph-compat {
        display: flex; flex-direction: column; gap: 4px;
        margin: 10px 0 0; padding: 10px 12px;
        border: 1px solid #7a5a2a; border-radius: 10px; background: #241d12;
      }
      .ph-compat-lead { font-size: 13px; font-weight: 650; color: #ffd7a0; }
      .ph-compat-hint { font-size: 12px; color: #c8b48f; }
      .ph-btn-blocked { opacity: 0.45; cursor: not-allowed; }

      /* 车库里的「当前可冒险状态」（Queue 必改 3：装完之后在这里就能看出来）。 */
      .ph-run-status {
        display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px;
        margin: 8px 0 0; padding: 8px 12px; border-radius: 10px; background: #1c2233;
      }
      .ph-run-status-label { font-size: 11px; color: #93a1b6; }
      .ph-run-status-value { font-size: 13px; font-weight: 650; color: #eaf1fb; }
      .ph-run-status-hint { font-size: 11px; color: #c8b48f; }
      .ph-run-status[data-ph-run-compat='unsupported'] { background: #241d12; }
      .ph-run-status[data-ph-run-compat='unsupported'] .ph-run-status-value { color: #ffd7a0; }

      /*
        PRODUCT-LOOP-R2-B｜合成（最小动作）。

        ⚠️ 卡片本身是 <button>，而「合成」也是一个按钮 —— HTML 不允许 button 套 button，
           所以合成按钮是卡片的**兄弟节点**，两者同放在 `.ph-card-cell` 里；合成按钮用绝对
           定位压在卡片右上角，视觉上仍在卡内，但 DOM 上是平级 ⇒ 合法且点击不会互相吞掉。
      */
      .ph-card-cell { position: relative; display: flex; }
      .ph-card-cell > .ph-card { flex: 1 1 auto; width: 100%; }
      .ph-card-full { border-color: #7a5b00; background: #191604; }
      .ph-card-badge { font-size: 10px; font-weight: 700; color: #ffd35a; }
      .ph-card-badge-max { color: #93a1b6; }
      .ph-card-fuse {
        position: absolute; top: 6px; right: 6px;
        font: inherit; font-size: 11px; font-weight: 700;
        padding: 4px 9px; border-radius: 999px;
        border: 1px solid #7a5b00;
        background: linear-gradient(180deg, #ffd35a, #e8a92c); color: #3a2600;
        cursor: pointer;
      }
      .ph-card-fuse:hover { background: linear-gradient(180deg, #ffe07e, #f0b53c); }

      /* 动作 */
      .ph-actions { display: flex; gap: 10px; margin-top: auto; padding-top: 12px; }
      .ph-btn {
        flex: 1 1 0;
        display: flex; align-items: center; justify-content: center;
        min-height: 46px; padding: 0 14px;
        font: inherit; font-size: 16px; font-weight: 700;
        border-radius: 11px; border: 1px solid #2b3550; background: #141c28; color: #cfe0ff;
        cursor: pointer; text-decoration: none;
      }
      .ph-btn:hover { background: #1c2740; }
      .ph-btn:disabled { opacity: 0.45; cursor: default; }
      .ph-btn-primary { border-color: #3d6494; background: #1d3352; color: #dbe9ff; }
      .ph-btn-primary:hover { background: #274267; }
      .ph-btn-start {
        border-color: #7a5b00; background: linear-gradient(180deg, #ffd35a, #e8a92c); color: #3a2600;
      }
      .ph-btn-start:hover { background: linear-gradient(180deg, #ffe07e, #f0b53c); }

      .ph-note { font-size: 11px; color: #7b8697; line-height: 1.6; }
      .ph-note-ok { color: #8fe0ad; }
      .ph-note-bad { color: #ff9c8f; }

      /*
        ══════════════════════════════════════════════════════════════════════════
        HOME-V2-MINIMAL-R1｜正式首页 = 产品首页（背景 + 中央车 + 主 CTA + 次级改车）。
        ⚠️ 只新增 `.ph-home-*` 规则 + `.ph-screen` 的层次背景；Garage 视图的
           `.ph-main-garage` 家族一字未动（其自身背景覆盖 screen 底色）。
        ⚠️ 契约类（.ph-actions / .ph-btn-start / open-garage / start-run）原样复用。
        ══════════════════════════════════════════════════════════════════════════
      */
      .ph-screen {
        /* 层次背景：上暗 → 中亮（车区聚光）→ 下收敛（CTA 区沉底） */
        background:
          radial-gradient(120% 34% at 50% 34%, rgba(84, 126, 194, 0.20) 0%, rgba(84, 126, 194, 0) 62%),
          linear-gradient(180deg, #0a0f18 0%, #0e1626 46%, #131f33 100%);
      }
      .ph-home-car {
        flex: 1 1 auto;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px;
        padding-top: 26px;
      }
      .ph-home-car .ph-car { transform: scale(1.06); }
      .ph-home-car-name {
        font-size: 14px; font-weight: 700; color: #cfe0ff; letter-spacing: 2px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      }
      .ph-home-actions {
        flex: 0 0 auto;
        flex-direction: column;
        gap: 12px;
        padding: 0 26px 34px;
      }
      .ph-home-start {
        min-height: 62px;

      }
      .ph-home-garage {
        min-height: 48px;
        font-size: 15px; font-weight: 700; letter-spacing: 3px;
        border-radius: 13px;
        background: rgba(20, 28, 40, 0.82);
      }

      /*
        PRODUCT-LOOP-R1-B｜领奖提示（玩家从 RUN COMPLETE 的「领取并返回」回到本页时出现）。
        三种形态与 Profile Repository 的真实结果一一对应：
          ok（已获得·入库成功）/ duplicate（本局已领取过）/ fail（校验未通过）。
      */
      .ph-claim {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.5;
        border: 1px solid #2b3850;
        background: #121a26;
        color: #c7d0df;
      }
      .ph-claim-ok { border-color: #3f6b52; background: #12211a; color: #8fe0ad; }
      .ph-claim-dim { color: #93a1b6; }
      .ph-claim-bad { border-color: #6b3f3f; background: #211414; color: #ff9c8f; }
      /*
        PRODUCT-LOOP-R2-RECOVERY（必改 6）｜领奖之后、刚好凑满时的那条下一步引导。
        ⚠️ 只提示「去哪儿做」，**不代劳**：合成必须由玩家在 Garage 里主动按下。
      */
      .ph-claim-hint { display: block; margin-top: 4px; font-weight: 700; color: #ffd35a; }

      /*
        ══════════════════════════════════════════════════════════════════════════
        PRODUCT-LOOP-P0-GARAGE-FOUR-SLOT-CLARITY-R3｜Garage = **四个同构装备槽**
        ══════════════════════════════════════════════════════════════════════════

        真人手机录屏：上一版把「槽位贴到车辆真实挂点上」，结果玩家看到的是
        「上面一个独立的武器悬浮块 + 下面 3 个像页签的按钮」⇒ 认知成了
        「3 个页签 + 1 个不知道是什么的武器块」。**该设计假设判定失败**，本轮删掉。

        结构（DOM 层就固定，不靠滚动位置）：

          .ph-main-garage     整页 overflow:hidden（**本页整体不滚**）
            .ph-header        标题 / 返回首页（返回恒可达）
            .ph-garage-stage  战车 Preview（**固定**）
            .ph-garage-current「当前装备」+ 2×2 装备槽（**固定**）
            .ph-my-parts      「选择〈槽位名〉装备」（固定）
            .ph-garage-body   **唯一**滚动容器：当前槽的部件卡阵
            .ph-garage-foot   合成入口（**持续可见且恒可点**）

        2×2 版面（DOM 顺序就是 `GARAGE_SLOT_ORDER`）：

          [ 武器 ] [ 车身 ]
          [ 后轮 ] [ 前轮 ]

        ⚠️ 「四个槽同规格」= **布局保证**：同一个 grid + 同一个 `.ph-slotnode` 规则，
           没有任何槽带专属 modifier / 专属宽高 / 绝对定位。
        ⚠️ 不使用缩字号 / 压 gap 维持旧信息架构（Queue 明令禁止）：这里改的是信息架构
           （2×2 同构槽 + 明确标题 + 未拥有降级 + 恒可点的合成入口），卡片字号 / 间距没动。
      */
      .ph-main-garage { overflow: hidden; gap: 0; padding: 0; position: relative; }

      /* 顶部「返回首页」（Queue 结构：顶部 = 标题 / 返回） */
      .ph-back {
        margin-left: auto;
        font: inherit; font-size: 12px; font-weight: 650;
        padding: 6px 12px; border-radius: 8px;
        border: 1px solid #2b3550; background: #131b28; color: #9fb3cc;
        cursor: pointer;
        align-self: center;
      }
      .ph-back:hover { background: #1a2536; border-color: #34507c; }

      /*
        战车 Preview（固定区）。
        ⚠️ R3：`padding` **退回首页同款**（`2px 0 0`）。R2 曾给预览框加 50/54 的留白，
           那是「槽位标签要跳出车体轮廓」的排版代价 —— 槽位已不再定位在车体上，
           留白随之删除（不是靠压 gap，而是删掉一个已无必要的内边距）。
      */
      .ph-garage-stage {
        flex: 0 0 auto;
        padding: 6px 12px 0;
      }
      .ph-garage-stage .ph-car-wrap {
        border-radius: 10px;
        padding: 2px 0 0;
      }

      /* 「当前装备」小节标题（2×2 装备槽之上的唯一标题） */
      .ph-garage-current {
        flex: 0 0 auto;
        display: flex; flex-direction: column; gap: 6px;
        padding: 8px 14px 4px;
      }
      .ph-garage-current-label { font-size: 12px; color: #7f8ca0; letter-spacing: 0.08em; }

      /*
        4 个**完全同构**的装备槽：固定 2×2（`1fr 1fr`）。
        ⚠️ 同尺寸来自「同一个 grid 的两列等宽」+「同一个 min-height」；
           同结构 / 同交互 / 同选中态来自「同一个 `.ph-slotnode` 规则」。
      */
      .ph-garage-slots {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .ph-slotnode {
        display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
        width: 100%;
        min-height: 54px;
        padding: 8px 10px;
        font: inherit; text-align: left;
        border-radius: 10px;
        border: 1px solid #2b3550; background: #131b28; color: #9fb3cc;
        cursor: pointer;
      }
      .ph-slotnode:hover { background: #1a2536; border-color: #34507c; }
      /*
        GADGET-GARAGE-SLOT-R2：第五槽（Gadget）**独立占下方一行**并**跨满整行**
        （grid 的第 3 行）。⚠️ 只加 `grid-column` 这一条 —— 它**不**改
        `.ph-slotnode` 本身的 padding / min-height / 字号 / 边框，
        因此 Gadget 槽与其它四槽仍然**同尺寸、同结构、同交互、同选中态**。
        ⚠️ 前四槽的 DOM 顺序与样式**一字未动**（仍是 2×2）。
      */
      .ph-slotnode-gadget { grid-column: 1 / -1; }
      .ph-slotnode-label { font-size: 11px; color: #7f8ca0; letter-spacing: 0.04em; }
      .ph-slotnode-value {
        font-size: 14px; font-weight: 700; color: #dbe6f7;
        max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      /*
        当前槽高亮**唯一**：`data-ph-slot-active="true"` 与 `.ph-slotnode-active` 同源。
        ⚠️ 只用**不影响布局**的属性（border-color / background / color / box-shadow）⇒
           高亮前后四个槽的尺寸逐像素相同（「同规格」不被高亮破坏）。
      */
      .ph-slotnode-active {
        border-color: #ffd35a;
        background: #1c2233;
        box-shadow: 0 0 0 1px rgba(255, 211, 90, 0.5), 0 0 12px rgba(255, 211, 90, 0.16);
      }
      .ph-slotnode-active .ph-slotnode-label { color: #b99a3f; }
      .ph-slotnode-active .ph-slotnode-value { color: #ffe9a8; }

      /*
        「选择〈槽位名〉装备」标题（固定区）。
        ⚠️ Queue 明令**不得**只写模糊的「我的装备」——玩家必须无需记忆就知道
           「我现在点下面的东西，会换哪个部位」。

      .ph-my-parts {

      .ph-my-parts-title { font-size: 14px; font-weight: 700; color: #dbe9ff; }

      .ph-garage-body {

      /*
        未拥有内容的**降级区**（Queue 必改 4：折叠 / 降级，不与可用内容同权重）。

      .ph-locked { border-top: 1px dashed #2b3550; padding-top: 8px; }

      .ph-modal-fig-name { font-size: 12px; font-weight: 650; color: #eaf1fb; text-align: center; }

    /* ══════════════════════════════════════════════════════════════════════════
       GARAGE-V2-UX-RETURN-BAG-FUSE-R1｜正式 Garage 2.0 交互结构（重做，不是微调）

       版面契约（逻辑 390×844 **恒定**；不再随浏览器窗口宽度变化）：

         .g2-head        40  标题（合成模式：标题 + 右上【返回装备】；装备页**没有**第二入口）
         .g2-stage      148  战车（保持可认）
         .g2-slots-row   74  五槽**同行**（每槽 1fr；旧版左三右二两列白吃两行高）
         .g2-note      变高   成功/失败提示（有才出现）
         .g2-bag-wrap  flex:1 1 auto; min-height:0  ← 背包外壳（**明确 min-height:0**）
           .g2-bag-head 48  三段 grid：背包 1fr / 点一件·换成它 auto 居中 /【合成】1fr 靠右
           .g2-bag     flex:1 1 auto; min-height:0; overflow-y:auto  ← 唯一滚动容器
         .g2-foot        64  【返回首页】（flex 固定 ⇒ 结构上不可能被长背包裁掉）

       ⚠️ 旧版缺陷 ①（真人录屏：返回按钮在屏外）：`.g2-bag-wrap` 不是 flex 列容器
          ⇒ `.g2-bag` 的 `flex` / `overflow` 全部失效 ⇒ 背包按内容撑高（实测 654px），
          footer 被顶到 y≈1198..1242（画面 844 之外，且外层 overflow:hidden 不可滚）
          ⇒ 玩家**结构上无法返回**。本版两级都显式写 flex + min-height:0。
       ⚠️ 旧版缺陷 ②（真人录屏：图标微小）：`.g2-grid` 带 `@media (min-width:430px)`
          → 5 列。逻辑画面恒 390，但**媒体查询看的是浏览器窗口** ⇒ 桌面 1440 变 5 列、
          图标被压到 62%（实测可见面积比 0.583）。本版删除**全部**宽度断点 + 图标 86%。
       ⚠️ 旧版缺陷 ③（真人录屏：操作沉重）：前/后轮与「替换/取消」四个按钮挤在同一行；
          合成是遮罩弹窗 + 44px 小图标列表。本版：目标=独立二选一、底部只留两个按钮、
          合成=同页模式 + 与背包同规格 4 列大图标。
    ══════════════════════════════════════════════════════════════════════════ */
      .g2-head {
        flex: 0 0 auto;
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px;
        height: 40px; padding: 0 12px;
      }
      .g2-title { font-size: 15px; font-weight: 800; color: #dbe9ff; letter-spacing: 1px; }
      .g2-pill {
        font: inherit; font-size: 12px; font-weight: 700;
        padding: 7px 13px; border-radius: 999px;
        border: 1px solid #2b3550; background: #131b28; color: #9fb3cc;
        cursor: pointer;
      }
      .g2-pill:active { background: #1c2740; }
      .g2-stage {
        flex: 0 0 auto;
        position: relative;
        height: 148px;
        overflow: hidden;
      }
      .g2-car {
        position: absolute; left: 0; top: 50%; transform: translateY(-50%);
        width: 100%; height: 136px;
      }
      .g2-car-item { position: absolute; }
      .g2-car-item img, img.g2-car-item { position: absolute; }
      .g2-car-fallback { background: rgba(120, 140, 170, 0.35); border-radius: 3px; }

      /* 五槽同行：同一个 grid + 同一条 .g2-slot 规则（无专属 modifier / 无绝对定位） */
      .g2-slots-row {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        padding: 0 12px 8px;
      }
      .g2-slot {
        height: 64px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px;
        border-radius: 12px;
        border: 1px solid #2b3550;
        background: #131b28;
        cursor: pointer;
        font: inherit; color: inherit; padding: 0;
        overflow: hidden;
      }
      .g2-slot .g2-part, .g2-slot .ph-part-icon {
        width: 82%; height: 66%; object-fit: contain;
      }
      .g2-slot-kind { font-size: 9px; color: #8b9bb2; letter-spacing: 1px; line-height: 1; }
      .g2-slot-empty { font-size: 12px; color: #55647d; line-height: 1; }
      .g2-slot-eq { border-color: #3f6099; background: #16202f; }

      /* 顶部提示（合成成功 / 失败如实回显） */
      .g2-note {
        flex: 0 0 auto;
        margin: 0 12px 6px;
        padding: 7px 10px;
        border-radius: 9px;
        font-size: 11px; line-height: 1.45;
      }
      .g2-note-ok { color: #8fe0ad; background: rgba(63, 143, 90, 0.12); border: 1px solid rgba(63, 143, 90, 0.42); }
      .g2-note-bad { color: #ff9c8f; background: rgba(226, 68, 92, 0.12); border: 1px solid rgba(226, 68, 92, 0.42); }

      /* 背包外壳：**明确 min-height:0 的 flex 列**（缺陷 ① 的结构性修复） */
      .g2-bag-wrap {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .g2-bag-head {
        flex: 0 0 auto;
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px;
        padding: 2px 12px 6px;
      }
      /* 装备页背包标题行：三段 grid ——「背包」左 1fr /「点一件 · 换成它」中 auto /【合成】右 1fr。
         两个 1fr 对称 ⇒ 中间这段**整行居中**，按钮靠 `justify-self:end` 贴右，提示不会被压住。
         （合成组行同样是 .g2-bag-head，但 data 值不是 equip ⇒ 仍走上面两段 flex。） */
      .g2-bag-head[data-g2-bag-head='equip'] {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        column-gap: 8px;
        min-height: 48px;
      }
      .g2-bag-head[data-g2-bag-head='equip'] .g2-bag-hint {
        justify-self: center;
        text-align: center;
        white-space: nowrap;
      }
      .g2-bag-head[data-g2-bag-head='equip'] .g2-fuse-btn {
        justify-self: end;
      }
      .g2-bag-title { font-size: 12px; font-weight: 700; color: #93a1b6; }
      .g2-bag-hint { font-size: 11px; color: #7b8ba3; }
      /* 【合成】入口：44×44 起跳的可点区域（移动端触控下限），亮起=有真实可合成组 */
      .g2-fuse-btn {
        font: inherit; font-size: 13px; font-weight: 800;
        display: inline-flex; align-items: center; justify-content: center; gap: 5px;
        min-width: 76px; min-height: 44px;
        padding: 0 14px; border-radius: 999px;
        border: 1px solid #2b3550;
        background: #131b28; color: #9fb3cc;
        cursor: pointer;
      }
      .g2-fuse-btn:active { background: #1c2740; }
      .g2-fuse-btn-ready {
        border-color: #7a5b00;
        background: linear-gradient(180deg, #ffd35a, #e8a92c); color: #3a2600;
      }
      .g2-fuse-dot {
        min-width: 18px; height: 18px; padding: 0 4px;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 999px; background: #e2445c; color: #fff;
        font-size: 11px; font-weight: 800; line-height: 1;
      }
      .g2-group-count { font-size: 11px; color: #7b8ba3; }
      .g2-bag {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        padding: 0 12px 10px;
      }
      .g2-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .g2-cell {
        position: relative;
        aspect-ratio: 1 / 1;
        display: flex; align-items: center; justify-content: center;
        border-radius: 12px;
        border: 2px solid var(--q, #4a5b74);
        background: radial-gradient(120% 120% at 50% 28%, rgba(38, 52, 74, 0.92), rgba(15, 21, 30, 0.96));
        cursor: pointer;
        font: inherit; padding: 0;
        overflow: hidden;
      }
      /* 图标主导：每格约 85%+（旧 62% → 现在 90% 内容盒 = 实测 0.86 格宽） */
      .g2-cell .g2-part, .g2-cell .ph-part-icon {
        width: 90%; height: 90%; object-fit: contain;
      }
      /* 角标降权：小、无底色、角落低对比（不再抢图形） */
      .g2-cell .g2-corner {
        position: absolute; left: 5px; bottom: 4px;
        font-size: 8px; line-height: 1;
        color: #7b8ba3;
        pointer-events: none;
      }
      /* 锁定件（装备中 / 旧星级 / 封顶）：**不整体灰到难认**（旧 0.42 → 0.72） */
      .g2-cell-locked { opacity: 0.72; border-style: dashed; }
      .g2-cell-locked::after {
        content: '🔒';
        position: absolute; right: 4px; top: 3px; font-size: 9px; opacity: 0.85;
      }
      /* 刚出炉的合成产物：金环（结果清晰；玩家下一次操作即消失） */
      .g2-cell-fresh {
        box-shadow: 0 0 0 3px #ffd35a, 0 0 16px rgba(255, 211, 90, 0.45);
        border-color: #ffd35a;
      }
      .g2-cell[data-q='white']  { --q: #9aa7b8; }
      .g2-cell[data-q='green']  { --q: #4caf6d; }
      .g2-cell[data-q='blue']   { --q: #3f8fd2; }
      .g2-cell[data-q='purple'] { --q: #9b6bd8; }
      .g2-cell[data-q='orange'] { --q: #e08b3a; }
      .g2-cell[data-q='red']    { --q: #e2445c; }
      .g2-cell[data-q='chrome'] {
        --q: #ffd35a;
        background: linear-gradient(135deg, rgba(255, 211, 90, 0.16), rgba(226, 68, 92, 0.16), rgba(63, 143, 210, 0.16));
      }

      /* 底部【返回首页】：flex 固定占位（不 sticky、不绝对定位，靠布局保证恒在画面内） */
      .g2-foot {
        flex: 0 0 auto;
        display: flex; justify-content: center;
        padding: 6px 14px 12px;
      }
      .g2-back {
        font: inherit; font-size: 15px; font-weight: 800; letter-spacing: 1px;
        width: 100%; min-height: 46px;
        border-radius: 12px;
        border: 1px solid #2b3550; background: #1a2536; color: #cfe0ff;
        cursor: pointer;
      }
      .g2-back:active { background: #24344a; }

      /* ── 对比弹窗（装备唯一入口） ── */
      .g2-mask {
        position: absolute; inset: 0; z-index: 10;
        background: rgba(5, 8, 13, 0.74);
        display: flex; align-items: center; justify-content: center;
        padding: 16px;
      }
      .g2-modal {
        width: 100%; max-width: 340px;
        max-height: 96%;
        overflow-y: auto;
        border-radius: 14px;
        border: 1px solid #2b3550;
        background: #101823;
        padding: 14px;
        display: flex; flex-direction: column; gap: 10px;
      }
      .g2-modal-title { font-size: 15px; font-weight: 800; color: #eaf1fb; }

      /* 前/后轮目标 = 独立二选一（缺陷 ③：不再与主操作抢同一行） */
      .g2-targets { display: flex; gap: 8px; }
      .g2-target {
        flex: 1 1 0;
        min-height: 48px;
        display: flex; align-items: center; justify-content: center; gap: 6px;
        border-radius: 10px;
        border: 1px solid #2b3550; background: #131b28; color: #9fb3cc;
        font: inherit; font-size: 12px; font-weight: 700;
        cursor: pointer; padding: 0 6px;
      }
      .g2-target .g2-part, .g2-target .ph-part-icon { width: 28px; height: 22px; object-fit: contain; }
      .g2-target-on {
        border-color: #4a7bd0; background: #1d3352; color: #dbe9ff;
        box-shadow: inset 0 0 0 1px rgba(74, 123, 208, 0.55);
      }
      .g2-target-label { white-space: nowrap; }

      .g2-compare { display: flex; align-items: stretch; gap: 8px; }
      .g2-col {
        flex: 1 1 0;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        padding: 10px 6px;
        border-radius: 10px;
        border: 1px solid #2b3550; background: #131b28;
      }
      .g2-col-new { border-color: var(--q, #4a7bd0); }
      .g2-col-tag { font-size: 10px; color: #7f92ad; letter-spacing: 2px; }
      .g2-col .g2-part, .g2-col .ph-part-icon { width: 64px; height: 48px; object-fit: contain; }
      .g2-col-q { font-size: 11px; font-weight: 700; }
      .g2-col[data-q='white']  { --q: #9aa7b8; } .g2-col[data-q='white']  .g2-col-q { color: #9aa7b8; }
      .g2-col[data-q='green']  { --q: #4caf6d; } .g2-col[data-q='green']  .g2-col-q { color: #4caf6d; }
      .g2-col[data-q='blue']   { --q: #3f8fd2; } .g2-col[data-q='blue']   .g2-col-q { color: #3f8fd2; }
      .g2-col[data-q='purple'] { --q: #9b6bd8; } .g2-col[data-q='purple'] .g2-col-q { color: #9b6bd8; }
      .g2-col[data-q='orange'] { --q: #e08b3a; } .g2-col[data-q='orange'] .g2-col-q { color: #e08b3a; }
      .g2-col[data-q='red']    { --q: #e2445c; } .g2-col[data-q='red']    .g2-col-q { color: #e2445c; }
      .g2-col[data-q='chrome'] { --q: #ffd35a; } .g2-col[data-q='chrome'] .g2-col-q { color: #ffd35a; }
      .g2-col-note { font-size: 10px; color: #93a1b6; text-align: center; min-height: 12px; }
      .g2-warn {
        font-size: 11px; line-height: 1.5; color: #e8b45a;
        background: rgba(232, 180, 90, 0.08);
        border: 1px solid rgba(232, 180, 90, 0.3);
        border-radius: 8px; padding: 6px 8px;
      }
      /* 底部主操作：**只有两个**（取消 次要 / 装备·替换 唯一主操作） */
      .g2-actions { display: flex; gap: 8px; }
      .g2-btn {
        font: inherit; font-size: 14px; font-weight: 800;
        min-height: 48px; border-radius: 11px;
        border: 1px solid #2b3550; background: #1a2536; color: #cfe0ff;
        cursor: pointer;
      }
      .g2-btn-cancel { flex: 0 0 96px; font-weight: 700; color: #9fb3cc; }
      .g2-btn-primary {
        flex: 1 1 auto;
        border-color: #4a7bd0; background: #274b7a; color: #fff;
      }
      .g2-btn:disabled { opacity: 0.4; cursor: not-allowed; }

      /* ── 合成弹窗（叠加在装备页之上；底层装备页/背包滚动位置原样保留） ── */
      .g2-fuse-overlay {
        position: absolute; inset: 0; z-index: 20;
        display: flex; align-items: center; justify-content: center;
        padding: 12px;
        background: rgba(5, 8, 13, 0.66);
        /* 遮罩自己吞掉点击 ⇒ 下层装备页结构上不可能被误触 */
      }
      .g2-fuse-modal {
        width: 100%; max-width: 352px;
        /* 逻辑画面 844 × 70% ≈ 590（高度明显小于全屏；宽度留 19px 两侧留白） */
        max-height: 70%;
        display: flex; flex-direction: column;
        min-height: 0;
        overflow: hidden;                 /* 只有候选区滚，头/底部恒固定 */
        border-radius: 16px;
        border: 1px solid #2b3550;
        background: #101823;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
      }
      .g2-fuse-modal-head {
        flex: 0 0 auto;
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 14px 4px;
      }
      .g2-fuse-hint {
        flex: 0 0 auto;
        padding: 0 14px 8px;
        font-size: 11px; line-height: 1.45; color: #8b9bb2;
      }
      /* 候选区：**唯一内部滚动层**（4 列大图标，靠滚动而非缩图标塞内容） */
      .g2-fuse-body .g2-bag-head { padding: 2px 0 6px; }
      .g2-fuse-body {
        flex: 1 1 auto; min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 0 12px 10px;
      }
      .g2-fuse-group { margin-bottom: 12px; }
      .g2-fuse-empty {
        padding: 14px 4px;
        font-size: 12px; line-height: 1.6; color: #a9b7ca;
      }
      /* 主件：金环（"要保留的这件"）；材料：压暗 + 料角标 + × 覆盖（"会被吃掉"） */
      .g2-cell-main { box-shadow: 0 0 0 3px #ffd35a, 0 0 14px rgba(255, 211, 90, 0.35); }
      .g2-cell-main .g2-corner { color: #ffd35a; font-weight: 800; }
      .g2-cell-consume { opacity: 0.36; filter: grayscale(0.65) saturate(0.5); }
      .g2-cell-consume::after {
        content: '×';
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; font-weight: 900; color: #ff7a7a;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.75);
      }
      .g2-cell-consume .g2-corner { color: #ff9c8f; font-weight: 800; }
      /* 底部固定区：主件 → 下一品质预览 +【返回装备】/ 唯一【确认五合一】（恒定高度，不跳动） */
      .g2-fuse-result {
        flex: 0 0 auto;
        display: flex; flex-direction: column; gap: 8px;
        padding: 10px 12px 12px;
        border-top: 1px solid rgba(63, 93, 130, 0.35);
        background: #101823;
      }
      .g2-fuse-preview { display: flex; align-items: center; gap: 10px; min-height: 48px; }
      .g2-fuse-actions { display: flex; gap: 8px; }
      .g2-fuse-back {
        flex: 0 0 104px; min-height: 48px;
        font: inherit; font-size: 14px; font-weight: 700;
        border-radius: 12px;
        border: 1px solid #2b3550; background: #1a2536; color: #9fb3cc;
        cursor: pointer;
      }
      .g2-fuse-back:active { background: #24344a; }
      .g2-fuse-actions .g2-fuse-confirm { flex: 1 1 auto; min-width: 0; }
      .g2-fuse-icons { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
      .g2-fuse-slot {
        width: 48px; height: 48px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 10px;
        border: 2px solid var(--q, #4a5b74);
        background: radial-gradient(120% 120% at 50% 28%, rgba(38, 52, 74, 0.92), rgba(15, 21, 30, 0.96));
      }
      .g2-fuse-slot .g2-part, .g2-fuse-slot .ph-part-icon { width: 84%; height: 84%; object-fit: contain; }
      .g2-fuse-slot[data-q='white']  { --q: #9aa7b8; }
      .g2-fuse-slot[data-q='green']  { --q: #4caf6d; }
      .g2-fuse-slot[data-q='blue']   { --q: #3f8fd2; }
      .g2-fuse-slot[data-q='purple'] { --q: #9b6bd8; }
      .g2-fuse-slot[data-q='orange'] { --q: #e08b3a; }
      .g2-fuse-slot[data-q='red']    { --q: #e2445c; }
      .g2-fuse-slot[data-q='chrome'] { --q: #ffd35a; }
      .g2-fuse-arrow { font-size: 14px; color: #7f92ad; }
      .g2-fuse-placeholder { font-size: 10px; color: #55647d; letter-spacing: 1px; }
      .g2-fuse-result-text { flex: 1 1 auto; font-size: 11px; line-height: 1.45; color: #a9b7ca; }
      .g2-fuse-confirm {
        flex: 0 0 auto;
        min-width: 104px; min-height: 48px;
        font: inherit; font-size: 13px; font-weight: 800;
        border-radius: 12px;
        border: 1px solid #7a5b00; background: linear-gradient(180deg, #ffd35a, #e8a92c); color: #3a2600;
        cursor: pointer;
      }
      .g2-fuse-confirm:disabled {
        border-color: #2b3550; background: #1a2536; color: #5f6d80;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="ph-root" class="ph-root"></div>
    <script type="module" src="/src/product/homeMain.ts"></script>
  </body>
</html>
